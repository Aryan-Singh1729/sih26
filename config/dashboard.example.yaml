# Raksh dashboard hardware configuration.
#
# Hardware records identities and verified capture modes only. Perception and
# safety thresholds are deliberately omitted until physical calibration in
# Perception.

schema_version: 1

storage:
  mount_point: /mnt/sdcard
  expected_device: /dev/sda1
  filesystem: ext4
  filesystem_label: realsense
  filesystem_uuid: 2d5d8e90-fcaf-4488-be0d-c08eeac752c7

realsense:
  model: Intel RealSense SR300
  usb_id: "8086:0aa5"
  serial: "617205001375"
  firmware: "3.21.0.0"
  librealsense_version: "2.50.0"
  source_path: /mnt/sdcard/librealsense
  build_path: /mnt/sdcard/librealsense/build
  stream:
    type: depth
    width: 640
    height: 480
    frames_per_second: 30
    pixel_format: Z16

emeet:
  model: EMEET SmartCam C950
  usb_id: "328f:00ea"
  serial: A260409000103685
  # Never replace this with a hard-coded /dev/videoN path.
  device_by_id: /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._EMEET_SmartCam_C950_A260409000103685-video-index0
  stream:
    width: 640
    height: 360
    frames_per_second: 30
    pixel_format: MJPG

perception:
  calibration_required: true
  depth_cone:
    columns: 16
    rows: 6
    near_percentile: 0.20
    minimum_valid_ratio: 0.20
  rays:
    count: 48
    sample_radius_pixels: 5
  valid_range_m:
    minimum: 0.05
    maximum: 5.0
  camera_mount:
    height_m: 0.40
    pitch_down_degrees: 0.0
  floor_tolerance_m: 0.04
  risk_thresholds_m:
    critical: 0.45
    close: 0.90
    intermediate: 1.80
  smoothing_alpha: 0.25
  risk_hysteresis_m: 0.05
  cluster_range_tolerance_m: 0.25
  maximum_cluster_gap_rays: 1
  # Mount values and risk distances are operational defaults. Measure and
  # calibrate them on the assembled robot before safety-critical use.

server:
  # Loopback is the safe default. Set this to the UNO Q's LAN address when a
  # dashboard laptop must connect; avoid exposing it on every interface.
  bind_address: 127.0.0.1
  port: 8080
  telemetry_updates_per_second: 10

